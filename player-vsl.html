  <body>
    <vturb-smartplayer

    <!-- Alvo da opção Mostrar conteúdo oculto no painel Vturb.
         A sentinela permanece fora da tela; o cartão real está na página pai. -->
    <div
      id="liberar-plano-vsl"
      class="liberar-plano-vsl"
      aria-hidden="true"
      style="display: none; position: absolute; left: -10000px; top: 0; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none"
    ></div>
    <noscript>Activa JavaScript para reproducir el video.</noscript>
    <script>
      (function () {
        "use strict";
        var playerId = "vid-6aa9ec0b2867174ee33fcba6";
        function notify(type, extra) {
          if (window.parent === window) return;
          window.parent.postMessage(
            Object.assign({ source: "quiz-vturb-v1", playerId: playerId, type: type }, extra || {}),
            window.location.origin,
          );
        }
        // Conecta a revelação feita pela Vturb ao React sem modificar seu DOM.
        var gate = document.getElementById("liberar-plano-vsl");
        var gateRevealed = false;
        function observeGate() {
          if (!gate || gateRevealed) return;
          if (window.getComputedStyle(gate).display !== "none") {
            gateRevealed = true;
            notify("content-revealed", { gate: "liberar-plano-vsl" });
          }
        }
        var gateObserver = new MutationObserver(observeGate);
        function startGateObservation() {
          gateObserver.disconnect();
          if (gate) gateObserver.observe(gate, { attributes: true, attributeFilter: ["style", "class", "hidden"] });
          observeGate();
        }
        startGateObservation();

        // Código de incorporação oficial; executado uma vez por documento.
        var script = document.createElement("script");
        script.src =
          "https://scripts.converteai.net/2c020fec-8a67-4db3-b123-26c255f32c5b/players/6aa9ec0b2867174ee33fcba6/v4/player.js";
        script.async = true;
        script.onerror = function () {
          notify("error");
        };
        document.head.appendChild(script);

        // API v4 no próprio custom element. Não consulta window.smartplayer.
        // A observação nunca altera reprodução, qualidade, volume ou tempo.
        var ready = false;
        var played = false;
        var milestones = new Set();
        var lastTime = 0;
        var interval;
        function observePlayer() {
          observeGate();
          try {
            var player = document.getElementById(playerId);
            if (!player) return;
            var time = Number(player.currentTime);
            var duration = Number(player.duration);
            if (!Number.isFinite(time) || !Number.isFinite(duration) || duration <= 0) return;
            if (!ready && time > lastTime) {
              ready = true;
              notify("ready");
            }
            if (!player.paused && !player.inSmartAutoPlay && !player.inResume && time > lastTime) {
              if (!played) {
                played = true;
                notify("play");
              }
              [25, 50, 75, 90, 100].forEach(function (percent) {
                if ((time / duration) * 100 >= percent && !milestones.has(percent)) {
                  milestones.add(percent);
                  notify("milestone", { percent: percent });
                }
              });
            }
            lastTime = time;
          } catch (_) {
            // Uma API ainda não inicializada não pode interromper a página.
          }
        }
        function startObservation() {
          window.clearInterval(interval);
          interval = window.setInterval(observePlayer, 500);
        }
        startObservation();
        // Safari/Chrome podem restaurar o documento inteiro do back-forward cache.
        window.addEventListener("pageshow", function () {
          startGateObservation();
          startObservation();
        });
        window.addEventListener("pagehide", function () {
          window.clearInterval(interval);
          gateObserver.disconnect();
        });
      })();
    </script>
